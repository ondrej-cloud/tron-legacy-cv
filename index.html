<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Stardust</title>
<meta name="description" content="Hand-tracked particle effects composited over your webcam, in the browser.">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage video.camera { position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1); transition: filter .6s ease; }
  /* light adds onto the camera image, black leaves it untouched */
  #effects { position: absolute; inset: 0; mix-blend-mode: screen; }
  .effect-layer, .effect-layer canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .effect-layer[hidden] { display: none; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.42) 100%); }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.166.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="stage">
  <div id="effects"></div>
  <div id="vignette"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
